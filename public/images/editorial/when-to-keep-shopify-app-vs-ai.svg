<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101820"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="25" fill="#70efbf">ADSX / MERCHANT WORKFLOWS</text><text x="48" y="145" font-family="Arial,sans-serif" font-size="38" fill="#edf4f7">LOOK BEYOND THE APP SCREEN</text><rect x="48" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="70" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">RECORDS</text><text x="70" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Who owns the history?</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Preserve required data</text><rect x="424" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="446" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">OPERATIONS</text><text x="446" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Who performs the work?</text><text x="446" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Verify ongoing actions</text><rect x="800" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="822" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">SUPPORT</text><text x="822" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Who handles failures?</text><text x="822" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Assign recovery ownership</text><text x="48" y="553" font-family="Arial,sans-serif" font-size="25" fill="#edf4f7">A familiar interface does not prove operational continuity.</text><text x="48" y="620" font-family="Arial,sans-serif" font-size="23" fill="#a4b5c3">Original AdsX illustration / Verify the functions your store needs</text></svg>