<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101820"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="25" fill="#70efbf">ADSX / MERCHANT WORKFLOWS</text><text x="48" y="145" font-family="Arial,sans-serif" font-size="38" fill="#edf4f7">ALERT ON A THRESHOLD CROSSING</text><rect x="48" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="70" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">DEFINE</text><text x="70" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">From 5 or more to below 5</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Use comparable quantities</text><rect x="424" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="446" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">NOTIFY</text><text x="446" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">A fixed staff destination</text><text x="446" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">No automatic purchases</text><rect x="800" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="822" y="288" font-family="Arial,sans-serif" font-size="34" fill="#70efbf">VERIFY</text><text x="822" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Repeat and recovery cases</text><text x="822" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Review existing shortages</text><text x="48" y="553" font-family="Arial,sans-serif" font-size="25" fill="#edf4f7">One alert does not replace forecasting or purchasing.</text><text x="48" y="620" font-family="Arial,sans-serif" font-size="23" fill="#a4b5c3">Original AdsX illustration / Verify the functions your store needs</text></svg>