<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#101820"/><text x="48" y="64" font-family="Arial,sans-serif" font-size="25" fill="#70efbf">ADSX / MERCHANT OPERATIONS</text><text x="48" y="145" font-family="Arial,sans-serif" font-size="40" fill="#edf4f7">RECOVER THE OPERATION, NOT A GUESS</text><rect x="48" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="70" y="288" font-family="Arial,sans-serif" font-size="36" fill="#70efbf">RECORD</text><text x="70" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Save the intended action</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Retain its request key</text><rect x="424" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="446" y="288" font-family="Arial,sans-serif" font-size="36" fill="#70efbf">CLASSIFY</text><text x="446" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Known or uncertain?</text><text x="446" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Inspect the response</text><rect x="800" y="218" width="352" height="258" rx="10" fill="#1b2a35" stroke="#425460"/><text x="822" y="288" font-family="Arial,sans-serif" font-size="36" fill="#70efbf">RECONCILE</text><text x="822" y="364" font-family="Arial,sans-serif" font-size="21" fill="#edf4f7">Resolve unknown results</text><text x="822" y="420" font-family="Arial,sans-serif" font-size="20" fill="#b6c7d1">Then choose next action</text><text x="48" y="553" font-family="Arial,sans-serif" font-size="26" fill="#edf4f7">A timeout alone does not prove that the operation failed.</text><text x="48" y="620" font-family="Arial,sans-serif" font-size="24" fill="#a4b5c3">Original AdsX illustration / Verify the actual account records</text></svg>