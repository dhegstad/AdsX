<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111113"/><rect x="72" y="72" width="56" height="8" fill="#fa6238"/><text x="72" y="132" font-family="Arial, sans-serif" font-size="25" letter-spacing="2" fill="#fa946f">MEASUREMENT / ILLUSTRATIVE CAMPAIGN</text><text x="72" y="216" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#faf9f6">Three numbers. Three different meanings.</text><rect x="72" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="98" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">ATTRIBUTED REVENUE</text><text x="98" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">$800 / $400 = 2.0×</text><text x="98" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23">Ten attributed $80 orders</text><rect x="562" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="588" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">AFTER ONE REFUND</text><text x="588" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">$720 / $400 = 1.8×</text><text x="588" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23">Retained revenue / media</text><rect x="1052" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="1078" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">AFTER COSTS</text><text x="1078" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">$720 − $300 − $400</text><text x="1078" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23"> $20 before overhead + creative</text><path d="M72 685 H1528" stroke="#3d3d42"/><text x="72" y="749" fill="#e4e4e7" font-family="Arial, sans-serif" font-size="27">Reconcile attribution, refunds, and variable costs before scaling.</text><text x="72" y="831" fill="#89898f" font-family="Arial, sans-serif" font-size="22">ADSX / WHOP ADVERTISING GUIDES</text></svg>