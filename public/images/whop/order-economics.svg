<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f1f7f2"/><g font-family="Arial, sans-serif"><text x="56" y="68" fill="#54665e" font-size="23" font-weight="700">ADSX / WHOP FIELD GUIDES</text><text x="56" y="154" fill="#143229" font-size="51" font-weight="700">What remains from a $50 order?</text><text x="56" y="208" fill="#54665e" font-size="27" font-weight="400">Illustration: domestic card, base fee only, no tax or optional fees.</text><rect x="56" y="286" width="277" height="270" rx="18" fill="#fff" stroke="#c8d9d0" stroke-width="2"/><text x="78" y="338" fill="#54665e" font-size="23" font-weight="700">PRODUCT</text><text x="78" y="418" fill="#143229" font-size="47" font-weight="700">$18.00</text><text x="78" y="472" fill="#54665e" font-size="24" font-weight="400">Item cost</text><rect x="353" y="286" width="277" height="270" rx="18" fill="#fff" stroke="#c8d9d0" stroke-width="2"/><text x="375" y="338" fill="#54665e" font-size="23" font-weight="700">DELIVERY</text><text x="375" y="418" fill="#143229" font-size="47" font-weight="700">$9.00</text><text x="375" y="472" fill="#54665e" font-size="24" font-weight="400">Pack + ship</text><rect x="650" y="286" width="277" height="270" rx="18" fill="#fff" stroke="#c8d9d0" stroke-width="2"/><text x="672" y="338" fill="#54665e" font-size="23" font-weight="700">PROCESSING</text><text x="672" y="418" fill="#143229" font-size="47" font-weight="700">$1.65</text><text x="672" y="472" fill="#54665e" font-size="24" font-weight="400">2.7% + $0.30</text><rect x="947" y="286" width="277" height="270" rx="18" fill="#d3f4df" stroke="#c8d9d0" stroke-width="2"/><text x="969" y="338" fill="#54665e" font-size="23" font-weight="700">REMAINING</text><text x="969" y="418" fill="#143229" font-size="47" font-weight="700">$21.35</text><text x="969" y="472" fill="#54665e" font-size="24" font-weight="400">Before other costs</text><text x="56" y="607" fill="#143229" font-size="25" font-weight="700">Remaining contribution is not net profit.</text><path d="M56 638H1224" stroke="#c8d9d0" stroke-width="2"/><text x="56" y="677" fill="#54665e" font-size="22" font-weight="400">Original AdsX illustration • October 2026</text><text x="1028" y="677" fill="#143229" font-size="22" font-weight="700">ADSX.COM</text></g></svg>