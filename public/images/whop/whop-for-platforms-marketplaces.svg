<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0a0d0f"/><g font-family="Arial, Helvetica, sans-serif"><text x="60" y="58" font-size="22" font-weight="700" fill="#7bd6d0">ADSX / WHOP FIELD GUIDE 25</text><text x="1220" y="58" text-anchor="end" font-size="18" fill="#a9b0b8">PAYMENTS AND OPERATIONS</text><text x="60" y="127" font-size="42" fill="#f8fafc" font-weight="700">Whop for Platforms: Plan a Marketplace Payment</text><text x="60" y="179.5" font-size="42" fill="#f8fafc" font-weight="700">Workflow</text><rect x="60" y="300" width="365" height="230" rx="12" fill="#141b21" stroke="#34404a"/><rect x="84" y="326" width="44" height="36" rx="6" fill="#7bd6d0"/><text x="106" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="#071014">1</text><text x="84" y="405" font-size="29" fill="#f8fafc" font-weight="700">Buyer pays</text><text x="84" y="477" font-size="21" fill="#bbc4cd" font-weight="400">$500 illustrative purchase</text><path d="M 433 410 h 17 m -7 -7 l 7 7 -7 7" fill="none" stroke="#7bd6d0" stroke-width="3"/><rect x="457" y="300" width="365" height="230" rx="12" fill="#141b21" stroke="#34404a"/><rect x="481" y="326" width="44" height="36" rx="6" fill="#7bd6d0"/><text x="503" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="#071014">2</text><text x="481" y="405" font-size="29" fill="#f8fafc" font-weight="700">Platform allocates</text><text x="481" y="477" font-size="21" fill="#bbc4cd" font-weight="400">$50 fee / $450 seller share*</text><path d="M 830 410 h 17 m -7 -7 l 7 7 -7 7" fill="none" stroke="#7bd6d0" stroke-width="3"/><rect x="854" y="300" width="365" height="230" rx="12" fill="#141b21" stroke="#34404a"/><rect x="878" y="326" width="44" height="36" rx="6" fill="#7bd6d0"/><text x="900" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="#071014">3</text><text x="878" y="405" font-size="29" fill="#f8fafc" font-weight="700">Seller receives</text><text x="878" y="441.25" font-size="29" fill="#f8fafc" font-weight="700">payout</text><text x="878" y="477" font-size="21" fill="#bbc4cd" font-weight="400">Check readiness and timing</text><text x="60" y="593" font-size="26" fill="#e5e9ee" font-weight="400">Model the transaction and its reversal before adding more sellers.</text><text x="60" y="689" font-size="17" fill="#9ba6b1">*Illustrative allocation before fees, taxes, reserves, and adjustments.</text><text x="1220" y="689" text-anchor="end" font-size="17" fill="#7bd6d0">adsx.com/topics/whop</text></g></svg>