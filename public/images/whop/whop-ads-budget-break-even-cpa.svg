<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#111113"/><rect x="72" y="72" width="56" height="8" fill="#fa6238"/><text x="72" y="132" font-family="Arial, sans-serif" font-size="25" letter-spacing="2" fill="#fa946f">BUDGET / ILLUSTRATIVE ORDER</text><text x="72" y="216" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#faf9f6">What can this sale afford?</text><rect x="72" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="98" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">REVENUE</text><text x="98" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700"> $80</text><text x="98" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23">After discounts; excluding tax</text><rect x="562" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="588" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">VARIABLE COSTS</text><text x="588" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">−$48</text><text x="588" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23">Product, delivery, fees, returns</text><rect x="1052" y="310" width="460" height="296" rx="8" fill="#1c1c20" stroke="#3d3d42"/><text x="1078" y="361" fill="#fa946f" font-family="Arial, sans-serif" font-size="21" letter-spacing="1">BEFORE ACQUISITION</text><text x="1078" y="456" fill="#faf9f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">= $32</text><text x="1078" y="535" fill="#c5c5c9" font-family="Arial, sans-serif" font-size="23">Also needed for overhead + profit</text><path d="M72 685 H1528" stroke="#3d3d42"/><text x="72" y="749" fill="#e4e4e7" font-family="Arial, sans-serif" font-size="27">At $22 media CPA, $10 remains before overhead and other acquisition costs.</text><text x="72" y="831" fill="#89898f" font-family="Arial, sans-serif" font-size="22">ADSX / WHOP ADVERTISING GUIDES</text></svg>